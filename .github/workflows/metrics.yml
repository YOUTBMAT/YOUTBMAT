name: Metrics
on:
  schedule: [{cron: "0 */12 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: YOUTBMAT
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          
          # 📊 Configuração Avançada de Linguagens
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: programming              # Foca apenas em linguagens de programação reais
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_indepth: yes                         # Varre commits antigos linha por linha
          plugin_languages_details: bytes, percentage
          
          # 🛑 LINHA MÁGICA: Ignora códigos prontos, bibliotecas pesadas e frameworks
          plugin_languages_ignored: html, css, javascript, node_modules, package-lock.json, venv
          
          # 🔀 Status de Pull Requests e Issues
          plugin_followup: yes
          plugin_followup_sections: user
