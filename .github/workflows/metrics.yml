name: Metrics
on:
  # Atualiza automaticamente a cada 12 horas
  schedule: [{cron: "0 */12 * * *"}]
  # Permite atualizar manualmente na aba Actions se quiser
  workflow_dispatch:
  # Atualiza sempre que você fizer um push na branch principal
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Configurações básicas de perfil
          user: YOUTBMAT
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          
          # 📊 Configuração Avançada de Linguagens (Para puxar Python/Processing)
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_indepth: yes          # Força a análise detalhada de commits antigos
          plugin_languages_details: bytes, percentage
          
          # 🔀 Status de Pull Requests e Issues
          plugin_followup: yes
          plugin_followup_sections: user
