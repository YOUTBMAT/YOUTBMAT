name: Metrics
on:
  schedule: [{cron: "0 */12 * * "}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: YOUTBMAT
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          
          # 📊 Linguagens mais usadas (Igual ao do eljobe)
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          
          # 🔀 Status de Pull Requests e Issues
          plugin_followup: yes
          plugin_followup_sections: user

          # 🏅 NOVO: Bloco de Conquistas estilo RPG
          plugin_achievements: yes
          plugin_achievements_threshold: C     # Exibe medalhas desde o nível básico
          plugin_achievements_secrets: yes     # Inclui medalhas escondidas do GitHub
          plugin_achievements_limit: 5          # Mostra até 5 medalhas em destaque

          # 📅 NOVO: Gráfico de hábitos e horários de commits
          plugin_habits: yes
          plugin_habits_from: 200               # Analisa os últimos 200 commits
          plugin_habits_days: 14                # Foco nos últimos 14 dias
          plugin_habits_facts: yes              # Exibe fatos rápidos sobre sua rotina
          plugin_habits_charts: yes             # Gera o gráfico visual de linhas/barras
